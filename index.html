
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cộng Đồng Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1120;color:#eef2ff;font-family:Arial,sans-serif}
header{padding:20px;background:#111c31;text-align:center}
header h2{color:#60a5fa;margin:0 0 8px}
main{max-width:850px;margin:20px auto;padding:12px}
.panel{background:#111c31;border:1px solid #293851;border-radius:14px;padding:15px;margin-bottom:15px}
input,textarea,button{font:inherit;border-radius:9px;padding:12px}
input,textarea{background:#0b1120;color:white;border:1px solid #34445f}
button{background:#3b82f6;color:white;border:0;cursor:pointer}
button:hover{filter:brightness(1.15)}
#messages{height:50vh;min-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.msg{background:#1b2940;padding:12px;border-radius:12px;max-width:90%;overflow-wrap:anywhere}
.mine{align-self:flex-end;background:#174a7c}
.name{color:#93c5fd;font-weight:bold;font-size:13px;margin-bottom:6px}
.time{color:#9caec5;font-size:11px;margin-top:7px}
.msg img,.msg video{max-width:100%;max-height:300px;display:block;margin-top:8px;border-radius:8px}
.row{display:flex;gap:8px;margin:10px 0}
.row input{flex:1;min-width:0;width:50%}
#message{width:100%;min-height:60px;resize:vertical}
#status{color:#a5b4fc;font-size:13px}
#preview{max-width:180px;max-height:130px;display:none;margin:10px 0}
@media(max-width:500px){main{margin:5px auto}.row{flex-wrap:wrap}}
</style>
</head>
<body>
<header>
<h2>🌐 CỘNG ĐỒNG CHAT</h2>
<div>Nơi kết nối và chia sẻ cùng mọi người</div>
</header>
<main>
<section class="panel">
<h3>👤 Tài khoản của bạn</h3>
<div class="row">
<input id="nickname" maxlength="30" placeholder="Nhập tên của bạn">
<button id="save">Lưu tên</button>
</div>
<div id="status">Chế độ xem thử trên máy tính</div>
</section>

<section class="panel">
<h3>💬 Phòng chat chung</h3>
<div id="messages" aria-live="polite"></div>
<textarea id="message" maxlength="3000" placeholder="Bạn muốn chia sẻ điều gì?"></textarea>
<div class="row">
<button id="send">Gửi tin nhắn ➤</button>
<label style="background:#263650;padding:12px;border-radius:9px;cursor:pointer">
📷 Chọn ảnh/video
<input id="file" type="file" accept="image/*,video/*" hidden>
</label>
</div>
<img id="preview" alt="Xem trước">
<button id="sendFile">Gửi ảnh/video</button>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let name=localStorage.getItem("chat_name")||"";
let file=null;
$("nickname").value=name;

$("save").onclick=()=>{
 name=$("nickname").value.trim();
 if(!name)return alert("Bạn hãy nhập tên!");
 localStorage.setItem("chat_name",name);
 alert("Đã lưu tên!");
};

function addMessage(author,text,media,type){
 const box=document.createElement("div");
 box.className="msg"+(author===name?" mine":"");
 const n=document.createElement("div");
 n.className="name";n.textContent=author;
 box.appendChild(n);
 if(text){
  const t=document.createElement("div");
  t.textContent=text;t.style.whiteSpace="pre-wrap";
  box.appendChild(t);
 }
 if(media){
  if(type==="video"){
   const v=document.createElement("video");
   v.src=media;v.controls=true;box.appendChild(v);
  }else{
   const img=document.createElement("img");
   img.src=media;img.alt="Ảnh chia sẻ";box.appendChild(img);
  }
 }
 const tm=document.createElement("div");
 tm.className="time";
 tm.textContent=new Date().toLocaleString("vi-VN");
 box.appendChild(tm);
 $("messages").appendChild(box);
 $("messages").scrollTop=$("messages").scrollHeight;
}

$("send").onclick=()=>{
 if(!name)return alert("Hãy nhập tên và bấm Lưu tên!");
 const text=$("message").value.trim();
 if(!text)return;
 addMessage(name,text);
 $("message").value="";
};

$("message").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();$("send").click();
 }
});

$("file").onchange=()=>{
 file=$("file").files[0]||null;
 $("preview").style.display="none";
 if(!file)return;
 if(!/^(image|video)\//.test(file.type)){
  alert("Chỉ chọn ảnh hoặc video!");
  file=null;return;
 }
 if(file.size>20*1024*1024){
  alert("Tệp tối đa 20 MB!");
  file=null;return;
 }
 if(file.type.startsWith("image/")){
  $("preview").src=URL.createObjectURL(file);
  $("preview").style.display="block";
 }
};

$("sendFile").onclick=()=>{
 if(!name)return alert("Hãy lưu tên trước!");
 if(!file)return alert("Bạn chưa chọn ảnh/video!");
 const url=URL.createObjectURL(file);
 addMessage(name,"",url,file.type.startsWith("video/")?"video":"image");
 file=null;
 $("file").value="";
 $("preview").style.display="none";
};
</script>
</body>
</html>
